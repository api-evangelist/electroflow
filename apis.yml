name: Electroflow
description: >-
  Electroflow Technologies is a United States deep-tech company (founded 2023,
  headquartered in San Bruno, California) developing an electrochemical direct
  lithium extraction (DLE) process that pulls lithium from dilute North American
  brines containing under 200ppm lithium using renewable electricity and minimal
  chemicals. Its cell uses anodes that absorb lithium ions from brine on one pass
  and release them into a carbonate solution on the reverse pass, producing
  battery-grade lithium carbonate that is reacted with iron and phosphate to make
  lithium iron phosphate (LFP) cathode powder domestically — a three-step route
  versus the traditional ten-step process, targeting LFP material at roughly 40%
  below Chinese producers. The company raised a $10M seed round in October 2025
  led by Union Square Ventures with Voyager Ventures, Fifty Years, and Harpoon
  Ventures, and counts Breakthrough Energy among its backers. Electroflow is a
  hardware and battery-materials company; it publishes no public API, SDK, or
  developer documentation, so this profile carries identity and domain-security
  signal only.
